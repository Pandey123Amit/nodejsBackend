version: "3.9"

services:
  postgres:
    image: "postgis/postgis:16-3.4"
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Amit@123
      POSTGRES_DB: RMS
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: {}
